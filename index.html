<p class="source-note">存档结构与游戏目录参考：<a href="https://github.com/lzj960515/bb-ee-databody-tool" target="_blank" rel="noopener">lzj960515 / bb-ee-databody-tool ↗</a> · 目录 17 个角色 / 297 项策略 · 独立实现的浏览器离线版本。</p>`;
function activeCount(){return $('#save-pair').checked?2:1}
function requests(){return Array.from({length:activeCount()},(_,i)=>{const ids=[],qualities=[];for(let j=0;j<2;j++){const s=lookup($(`#save-strategy-${i}-${j}`).value);if(!s)throw Error(`数据体${i?'二':'一'}的策略 ${j+1} 尚未选择有效目录条目`);ids.push(s.id);qualities.push(Number($(`#save-quality-${i}-${j}`).value))}return window.CharacterBodyUI.prepare(i,window.FullBodyUI.prepare(i,{character:Number($(`#save-character-${i}`).value),color:Number($(`#save-color-${i}`).value),ids,qualities}))})}
function updateEffect(i,j){const s=lookup($(`#save-strategy-${i}-${j}`).value),q=$(`#save-quality-${i}-${j}`),el=$(`#save-effect-${i}-${j}`);if(!s){el.textContent='从目录中选择策略；仅接受完整名称或目录选项。';return}const old=Number(q.value);q.innerHTML=s.qualities.slice().reverse().map(v=>`<option value="${v}">${['','白','蓝','紫','金'][v]} · ${v}</option>`).join('');q.value=String(s.qualities.includes(old)?old:Math.max(...s.qualities));const detail=s.quality_details?.find(d=>d.quality===Number(q.value));el.textContent=`${s.category}${s.is_combined?' · 双重策略':''} · ${detail?.description||s.description}`}
function updatePreview(){
 $('#body-form-1').hidden=!$('#save-pair').checked;
 try{const rs=requests();$('#save-preview').innerHTML=rs.map((r,i)=>`<div><strong>${i?'B':'A'} · ${esc(charMap.get(r.character).name)}</strong><span>${r.color===4?'金色 / 700':'紫色 / 600'} 分</span><p>${r.ids.map((id,j)=>esc(strategyMap.get(id).name)+`（${['','白','蓝','紫','金'][r.qualities[j]]}）`).join(' ＋ ')}</p><p>${r.owned?'自身策略 '+r.owned.length+' 项':'传承用 · 两项自身策略'} · ${r.full_potentials?'全潜能 '+charMap.get(r.character).full_potentials.length+' 项':'初始潜能'}</p>${window.CharacterBodyUI.summary(r)}</div>`).join('')}catch{$('#save-preview').innerHTML='<p class="muted">选择角色与两项传出策略。完整搭配还需先补齐前置并通过校验；两项传出策略需在自身搭配中。</p>'}
 $('#save-generate').disabled=!original||reading||!$('#save-exited').checked;
}
function warehouse(){const query=$('#save-warehouse-search').value.trim().toLowerCase();if(!doc)return;const rows=doc.entries.map(e=>{const name=charMap.get(Number(Core.vi(e.body,2)))?.name||`角色 ${Core.vi(e.body,2)}`,strats=Core.fields(e.body,30).map(f=>{const m=Core.nest(f),id=Number(Core.vi(m,1)),q=Number(Core.vi(m,2));return `${strategyMap.get(id)?.name||'策略 '+id}（品质 ${q}）`});return {uid:e.uid.toString(),name,strats,score:Core.dv(e.body,16)}}).filter(r=>JSON.stringify(r).toLowerCase().includes(query));$('#save-warehouse').innerHTML=`<table><thead><tr><th>编号</th><th>载体角色</th><th>传出继承策略</th><th>评分</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.uid}</td><td>${esc(r.name)}</td><td>${esc(r.strats.join(' / ')||'无')}</td><td>${r.score}</td></tr>`).join('')}</tbody></table>${!rows.length?'<p class="muted">没有匹配的数据体。</p>':''}`}
function download(data,name){const url=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function clear(){loadToken++;original=null;doc=null;filename='';reading=false;invalidate();$('#save-file').value='';$('#save-backup').disabled=true;$('#save-count').textContent='尚未载入';$('#save-file-info').textContent='支持当前参考格式的 LZ4 / AutoSave 文件，最大 64 MiB。';$('#save-warehouse').innerHTML='<p class="muted">载入存档后显示。已有数据体保持原样。</p>';$('#save-exited').checked=false;message('已清除存档，可重新选择文件。');updatePreview()}
$('#save-file').addEventListener('change',async e=>{const file=e.target.files[0];clear();if(!file)return;reading=true;const token=loadToken;message('正在解析并校验存档…');updatePreview();try{if(file.size>64*1024*1024)throw Error('文件超过 64 MiB 上限');const raw=new Uint8Array(await file.arrayBuffer());if(token!==loadToken)return;const parsed=Core.inspect(raw,C.rules);original=raw;filename=file.name;doc=parsed;$('#save-count').textContent=`${doc.entries.length} / ${doc.capacity} 已解锁容量`;$('#save-file-info').textContent=`${filename} · ${(file.size/1024).toFixed(1)} KiB · 已校验 AutoSave 和数据体编号`;$('#save-backup').disabled=false;warehouse();message('存档已载入。完成配置后生成新文件；原文件不会被网页覆盖。')}catch(err){message('载入失败：'+err.message,true)}finally{if(token===loadToken){reading=false;updatePreview()}}});
$('#save-clear').addEventListener('click',clear);
$('#save-backup').addEventListener('click',()=>{if(original){download(original,`${filename}.original.bak`);message('已发起原始备份下载。请保留该文件；恢复时复制回原存档位置并改回原数字文件名。')}});
$('#save-warehouse-search').addEventListener('input',warehouse);
$('#saves-view').addEventListener('input',e=>{if(e.target.id==='save-warehouse-search'||e.target.type==='file')return;if(e.target.matches('input,select')){invalidate();for(let i=0;i<2;i++)for(let j=0;j<2;j++)updateEffect(i,j);updatePreview();if(original)message('配置已更新，请重新校验生成。')}});
$('#saves-view').addEventListener('change',e=>{if(e.target.matches('select')||e.target.type==='checkbox'){invalidate();for(let i=0;i<2;i++)for(let j=0;j<2;j++)updateEffect(i,j);updatePreview()}});
$('#save-generate').addEventListener('click',()=>{
 invalidate();try{if(!original||!$('#save-exited').checked)throw Error('请载入存档并确认已退出游戏');const rs=requests();result=Core.append(original,rs,C);$('#save-export').disabled=false;$('#save-result').hidden=false;$('#save-result').innerHTML=`<strong>校验通过：${result.before} → ${result.after} 个数据体</strong><p>新增编号：${esc(result.uids.join('、'))}。已回读新增记录、核对已有数据体和其他存档模型。</p><p>先点击「下载原始备份」，再下载修改后存档。将下载的 <code>${esc(filename)}.modified</code> 复制到原 Save 文件夹，改名为 <code>${esc(filename)}</code> 并替换对应数字存档文件（注意不要保留 .modified 后缀）。保留备份，启动游戏检查；如需恢复，用备份覆盖回原数字文件。</p><p>生成结果始终基于本次载入的原文件。再次点击生成不会重复叠加；需要继续添加时，请重新载入上次导出的新存档。替换前如游戏或云同步更新了存档，请重新载入最新文件再生成。</p>`;message(`已生成 ${rs.length} 个数据体（含所选自身策略与潜能配置）。可以下载新存档。`)}catch(err){message('无法生成：'+err.message,true)}
});
$('#save-export').addEventListener('click',()=>{if(result){download(result.output,`${filename}.modified`);message('已发起修改后存档下载。请按下方说明改回数字文件名，再替换对应槽位。')}});
$('#saves-view').addEventListener('click',e=>{const button=e.target.closest('[data-save-pick]');if(!button)return;const i=Number(button.dataset.saveBody),id=Number(button.dataset.savePick),s=strategyMap.get(id);for(let j=0;j<2;j++)if(!$(`#save-strategy-${i}-${j}`).value.trim()){$(`#save-strategy-${i}-${j}`).value=key(s);updateEffect(i,j);invalidate();updatePreview();return}message(`数据体${i?'二':'一'}的两项策略已填满。先清空要替换的输入框，再点击候选策略。`,true)});
window.SaveBodyUI={openCombo(b){
 combo=b;invalidate();$('#save-pair').checked=true;
 const notes=[];
 for(let i=0;i<2;i++){
  $('#full-mode-'+i).value='legacy';$('#full-panel-'+i).hidden=true;
  for(let j=0;j<2;j++)$(`#save-strategy-${i}-${j}`).value='';
  const names=[...new Set(b.slots.flatMap(s=>s[i?'inheritB':'inheritA'].map(c=>c.text)).filter(Boolean))];const known=[],unknown=[];
  for(const name of names){const alternatives=name.split(/[\/／\n]/).map(n=>n.trim()).filter(Boolean);for(const name of alternatives){const matches=C.strategies.filter(s=>s.name===name);if(matches.length===1)known.push(matches[0]);else unknown.push(name)}}
  const unique=[...new Map(known.map(s=>[s.id,s])).values()];
  const el=$(`#save-recommendations-${i}`);el.hidden=false;el.innerHTML=`<strong>原表 ${i?'B':'A'} 栏 · 候选策略</strong><p>点击候选项填入空槽。每个数据体最多传出两项；原表准备栏可能同时包含升级路线，需自行选定传出项。</p><div>${unique.map(s=>`<button type="button" data-save-body="${i}" data-save-pick="${s.id}">${esc(s.name)}${s.is_combined?' · 双重':''}</button>`).join('')||'<span class="muted">原表未指定可映射候选项，请手动选择。</span>'}</div>${unknown.length?`<p class="save-error">以下原文未找到唯一目录对应，未自动填入：${unknown.map(esc).join('、')}。请手动核对名称。</p>`:''}`;
  if(unique.length===2&&!unknown.length&&names.length===2&&names.every(n=>!/[\/／\n]/.test(n))){unique.forEach((s,j)=>{$(`#save-strategy-${i}-${j}`).value=key(s)})}
  for(let j=0;j<2;j++)updateEffect(i,j);
  if(unknown.length)notes.push(`${i?'B':'A'} 栏含未映射名称`);
 }
 $('#save-combo-note').hidden=false;$('#save-combo-note').innerHTML=`<strong>来自组合：${esc(b.name)}</strong><p>候选项严格取自原表 A/B 传承准备栏；斜杠备选分开显示，不会自动选定。只在一栏恰有两项明确策略时预填。${notes.length?esc(notes.join('；'))+'，请核对。':''}</p><p>选择两个不同的载体角色，并确认每个数据体真正需要传出的两项策略。原表版本可能与游戏目录不同，请按当前游戏核对。</p>`;message('已载入组合候选项，请选择并核对每个数据体的两项传承策略。');updatePreview();
 }};
window.CharacterBodyUI.mount({invalidate,updatePreview,message});
window.FullBodyUI.mount({invalidate,updatePreview,updateEffect,message,download});
updatePreview();
})();

const unique=a=>[...new Set(a.filter(Boolean))];
const normalize=s=>(s||'').replace(/\s/g,'').trim();
function targets(b){return unique(b.slots.flatMap(s=>s.reds.map(x=>x.text)));}
function filterBuilds(builds,{rank=0,mode='all',query='',onlySaved=false},favorites=[]){
 const q=normalize(query).toLowerCase();
 return builds.filter(b=>(!rank||b.count===rank)&&(mode!=='normal'||!b.memorial)&&(mode!=='memorial'||b.memorial)&&(!onlySaved||favorites.includes(b.id))&&(!q||normalize(JSON.stringify(b)).toLowerCase().includes(q)));
}
function checklist(b){
 const notes=b.notes.flatMap(n=>n.text.split(/(?<=[。！!])\s*/)).map(s=>s.trim()).filter(Boolean);
 if(notes.length)return notes.map((text,i)=>({id:`note-${i}`,text}));
 return b.slots.map((s,i)=>({id:`slot-${i}`,text:`${s.slot}：${s.stages.map(c=>c.text).filter(Boolean).join(' → ')}；目标双重策略：${s.reds.map(c=>c.text).join('、')||'原表未填写'}`}));
}
function findRecords(data,name){
 const names=unique([name,...name.split(/[\/／]/)]).map(normalize);
 const conditions=data.conditions.filter(x=>names.includes(normalize(x.name)));
 const strategies=data.strategies.filter(x=>names.includes(normalize(x.name)));
 return {conditions,strategies};
}

const displayColor=arg=>{const c=(arg||'FF000000').slice(-6).toUpperCase();return c==='000000'?'#dbd5e0':c==='FF0000'?'#ff7787':c==='FFC000'?'#efbd61':c==='0070C0'?'#73b9f2':c==='00B050'?'#6bd1a3':'#'+c};
function phase(c){const x=(c.color||'').slice(-6).toUpperCase();if(x==='FF0000')return '传承';if(x==='FFC000')return '局内';if(x==='0070C0')return '黑市';if(x==='00B050')return '先留空';return '';}
function rich(c){return c.runs?.length?c.runs.map(r=>`<span style="color:${displayColor(r.color)}">${esc(r.text)}</span>`).join(''):esc(c.text);}
function pick(c,withPhase=false){if(!c?.text)return '<span class="empty-dash">—</span>';const p=phase(c);return `<span style="color:${displayColor(c.color)};font-weight:${c.bold?700:400}"><button class="strategy-name" data-strategy="${esc(c.text)}">${rich(c)}</button>${withPhase&&p?`<br><span class="stage-chip">${p}</span>`:''}</span>`;}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('visible');setTimeout(()=>$('#toast').classList.remove('visible'),2100);}
function current(){return data.combos.find(b=>b.id===state.selected);}
function filtered(){return filterBuilds(data.combos,state,favorites);}
function renderRanks(){
 $('#rank-filters').innerHTML=[0,5,6,7,8,9].map(n=>`<button class="rank ${state.rank===n?'selected':''}" data-rank="${n}" aria-pressed="${state.rank===n}"><span>${n?`${n} 红策略`:'全部组合'}</span><strong>${n?data.combos.filter(b=>b.count===n).length:data.combos.length}</strong></button>`).join('');
 $('#favorite-count').textContent=favorites.length;$('#favorite-filter').classList.toggle('active',state.onlySaved);
}
function renderList(){
 const builds=filtered();$('#result-count').textContent=`${builds.length} 套${state.onlySaved?'收藏':''}方案`;
 if(!builds.length){$('#build-list').innerHTML='<div class="empty-state">没有找到对应方案。<br>试试其他数量或策略名称。<button data-clear>清除筛选</button></div>';$('#build-detail').innerHTML='<div class="empty-state">调整筛选后，选择一套组合开始。</div>';return;}
 if(!builds.some(b=>b.id===state.selected))state.selected=builds[0].id;
 $('#build-list').innerHTML=builds.map(b=>{const reds=targets(b);return `<button class="build-card ${b.id===state.selected?'selected':''}" data-build="${b.id}" aria-current="${b.id===state.selected}"><div class="card-top"><span class="count-badge">${b.count}<small>红</small></span><span><span class="card-title">${esc(b.name)}</span><span class="card-sub">${b.memorial?'黑市纪念方案':b.blackMarket?'含黑市操作':'常规组合'} · ${b.slots.length} 个策略位</span></span>${favorites.includes(b.id)?'<span class="card-star">★</span>':''}</div><div class="mini-reds">${reds.slice(0,2).map(s=>`<span>${esc(s)}</span>`).join('')}${reds.length>2?`<span class="more">+${reds.length-2}</span>`:''}</div></button>`}).join('');
 renderDetail();
}
function noteBox(b){return b.notes.length?`<div class="notice"><strong>! 操作顺序与提醒 · 原表原文</strong>${b.notes.map(n=>`<p>${esc(n.text)}</p>`).join('')}</div>`:'<div class="notice"><strong>按原表路线搭配</strong><p>本组合未单列操作备注。对照下方策略的占用与激活条件选择，原表未填写的条件不作补充推断。</p></div>';}
function route(b){
 return `<div class="section-label">最终双重策略 <small>斜杠表示原表备选项，不重复计数</small></div><div class="target-cloud">${targets(b).map(t=>`<button class="target-pill" data-strategy="${esc(t)}"><i>◆</i>${esc(t)}</button>`).join('')}</div><div class="section-label">五位置升级路线 <small>点击策略名称，查看激活条件</small></div><div class="route-head"><span>策略位</span><span>1 级 · 起点</span><span>2 级 · 分支</span><span>3 级 · 成型</span><span>双重策略</span></div>${b.slots.map((s,i)=>`<div class="route-row"><div class="slot">${s.slot}<small>${['ATTACK','SKILL','DASH','LEGACY','SUMMON'][i]}</small></div>${s.stages.map(c=>`<div class="strategy-cell">${pick(c,true)}</div>`).join('')}<div class="strategy-cell reds">${s.reds.map(c=>pick(c,true)).join('')||'<span class="empty-dash">—</span>'}</div></div>`).join('')}<div class="route-legend"><span><i class="dot red"></i>传承</span><span><i class="dot amber"></i>局内</span><span><i class="dot blue"></i>黑市</span><span><i class="dot green"></i>黑市前留空</span></div>${noteBox(b)}`;
}
function inherit(b){
 const any=b.slots.some(s=>[...s.inheritA,...s.inheritB].some(c=>c.text));
 return `<div class="save-actions" style="margin:0 0 18px"><button class="target-pill" data-export-combo>为此组合准备传承数据体 →</button><button class="target-pill" data-export-full>添加此完整搭配的数据体 →</button></div><p class="info-note">先准备两个传承角色。以下严格对应原表 A / B 栏，空白表示原表未填写。原表提供的是最低需求，可在不冲突的情况下增加传承策略。</p>${any?`<div class="inherit-grid">${['A','B'].map(x=>`<div class="inherit-card"><div class="inherit-title"><span class="letter">${x}</span>${esc(b['inheritLabel'+x]||'传承角色'+x)}</div>${b.slots.map(s=>`<div class="inherit-row"><div class="slot">${s.slot}</div><div class="inherit-picks">${s['inherit'+x].filter(c=>c.text).map(c=>pick(c)).join('')||'<span class="empty-dash">未指定</span>'}</div></div>`).join('')}</div>`).join('')}</div>`:'<div class="empty-state">这套组合的原表未填写传承角色配置。<br>请结合组合路线与操作备注准备。</div>'}${noteBox(b)}`;
}
function execution(b){const steps=checklist(b);const done=checks[b.id]||[];return `<div class="section-label">执行清单 <small>${steps.filter(x=>done.includes(x.id)).length} / ${steps.length} 已完成　<button class="reset-button" data-reset-checks>重置</button></small></div><p class="info-note">${b.notes.length?'按原表备注分段，顺序保持原文；备选方式与提醒也保留在清单中。':'原表无独立步骤说明，以下按五个策略位列出收集目标。'}进度仅保存在当前浏览器。</p><div class="progress-track"><div style="width:${100*steps.filter(x=>done.includes(x.id)).length/steps.length}%"></div></div><div class="steps">${steps.map((x,i)=>`<label class="check-step ${done.includes(x.id)?'completed':''}"><input type="checkbox" data-check="${x.id}" ${done.includes(x.id)?'checked':''}><span><span class="step-index">${String(i+1).padStart(2,'0')} / 原文要点</span><span class="check-copy">${esc(x.text)}</span></span></label>`).join('')}</div>`;}
function renderDetail(){const b=current();if(!b)return;const fav=favorites.includes(b.id);
 $('#build-detail').innerHTML=`<div class="detail-header"><div><div class="eyebrow"><span class="tag">${b.count} 红组合</span>${b.memorial?'<span class="tag memorial">黑市纪念</span>':''}<span>BUILD / ${String(data.combos.indexOf(b)+1).padStart(2,'0')}</span></div><h2>${esc(b.name)}</h2><div class="sub">${esc(b.source)} · 原表第 ${b.row} 行</div></div><div class="header-actions"><button class="icon-button" data-save aria-label="${fav?'取消收藏':'收藏组合'}" title="${fav?'取消收藏':'收藏组合'}" style="color:${fav?'var(--amber)':'inherit'}">${fav?'★':'☆'}</button><button class="icon-button" data-share aria-label="复制组合链接" title="复制组合链接">↗</button></div></div><div class="detail-tabs" role="tablist">${[['route','组合路线'],['inherit','传承准备'],['execution','执行清单']].map(([t,label])=>`<button data-detail-tab="${t}" role="tab" aria-selected="${state.detailTab===t}" class="${state.detailTab===t?'active':''}">${label}</button>`).join('')}</div><div class="detail-body">${state.detailTab==='route'?route(b):state.detailTab==='inherit'?inherit(b):execution(b)}<div class="source-note">内容来源：<a href="${source(b.tab,b.row)}" target="_blank" rel="noopener">${esc(b.source)} · 第 ${b.row} 行起 ↗</a>${b.memorial?'　· 原表标注“纪念”，请留意版本差异。':''}</div></div>`;
}
function records(){
 const names=unique([...data.conditions.map(x=>x.name),...data.strategies.map(x=>x.name)]);
 return names.map(name=>({name,c:data.conditions.find(x=>x.name===name),s:data.strategies.find(x=>x.name===name)}));
}
function renderCatalog(){
 const all=records();const elements=unique(all.map(x=>x.c?.element||x.s?.element)).sort();
 $('#element-filters').innerHTML=['全部',...elements].map(e=>`<button data-element="${esc(e)}" class="${state.element===e?'active':''}">${esc(e)}</button>`).join('');
 const filtered=all.filter(x=>(state.element==='全部'||(x.c?.element||x.s?.element)===state.element)&&(!state.query||normalize(JSON.stringify(x)).includes(normalize(state.query))));
 $('#catalog-results').innerHTML=filtered.map(x=>`<button class="catalog-card" data-strategy="${esc(x.name)}"><span class="tag">${esc(x.c?.element||x.s?.element||'未分类')}</span><h3>${esc(x.name)}</h3><p>占用 <strong>${esc((x.c?.occupancy||x.s?.occupancy||[]).join(' / ')||'原表未填写')}</strong></p><p>触发 <strong>${esc(x.c?.type||x.s?.activation.join(' / ')||'查看详情')}</strong></p><div class="bottom"><span>${x.c?'传承 / 局内条件':'升级分支信息'}</span><span>查看档案 ↗</span></div></button>`).join('')||'<div class="empty-state">没有匹配的策略，请换一个关键词。</div>';
}
function renderMechanics(){
 const rule=data.summary.find(x=>x.row===16);const minimum=data.summary.find(x=>x.row===14);const colorNote=data.summary.find(x=>x.row===320);
 $('#mechanics-view').innerHTML=`<div class="mechanics-grid"><article class="article-card wide"><p class="overline">START HERE</p><h2>先看颜色，再看顺序。</h2><div class="rule-grid"><div class="rule"><h3>01 / 准备传承</h3><p>红色代表原表标记的传承策略。进入组合的「传承准备」，分别查看 A、B 两个角色的配置。</p></div><div class="rule"><h3>02 / 沿路线升级</h3><p>每个位置保留 1、2、3 级和双重策略的对应关系。橙色代表局内完成，蓝色代表黑市完成。</p></div><div class="rule"><h3>03 / 留意空位</h3><p>绿色代表黑市前需要留空的策略。部分方案需要先形成指定组合，再补上关键位置。</p></div><div class="rule"><h3>04 / 按备注执行</h3><p>“先拿…再拿…”会影响双重激活。执行清单保留原文的先后顺序，可边玩边勾选。</p></div></div></article><article class="article-card wide"><p class="overline">CORE MECHANICS</p><h2>占用、共存与双激活</h2><p>${rich(rule)}</p><a class="source-link" href="${source('jljo9c',16)}" target="_blank" rel="noopener">对应总汇第16行 ↗</a></article><article class="article-card"><h2>组合与版本说明</h2><p>${esc(minimum.text)}</p><h3>黑市纪念方案</h3><p>“黑市8红策略（纪念）”和“黑市9红策略（纪念）”按原表保留，不将历史方案改写为当前版本已验证结论。</p><h3>颜色深浅与粗体</h3><p>${esc(colorNote?.text||'深颜色策略必须继承；浅色策略继承可锦上添花；粗体表示不能从局内获得。')}</p><p>网页保留原始颜色。只在颜色含义明确时添加“传承 / 局内 / 黑市 / 先留空”文字标签。</p></article><article class="article-card"><h2>来源与致谢</h2><p>表格出处：${esc(data.credits.group)}<br>表格制作者：${esc(data.credits.maker)}</p><p>策略提供及验证：${esc(data.summary.find(x=>x.row===5)?.text)}</p><p>全策略详情原作者：B站 UP主 FebCo。修订：Soul / @下辈子想做猫（2024.03.18），sjs / @就是就是一万个（2025.05.04）。</p><p>网页数据快照：${data.snapshot}<br>整理范围：9个指定工作表 · 76套有名称的组合。原表空白模板未计入。</p><a class="source-link" target="_blank" rel="noopener" href="${data.sourceUrl}">打开腾讯文档原表 ↗</a></article><article class="article-card wide"><h2>原文对照</h2><p>需要核对表格语义时，可查看这三个信息页的原始单元格内容。行号与原表对应，合并单元格仅在起始位置列出。</p><div class="raw-tabs">${data.rawSheets.map((s,i)=>`<button data-raw="${i}">${esc(s.name)}</button>`).join('')}</div><div id="raw-content"></div></article></div>`;
 renderRaw(0);
}
function renderRaw(i){const s=data.rawSheets[i];$('#raw-content').innerHTML=`<div class="source-note"><a href="${source(s.id)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a></div><div class="raw-scroll"><table class="raw-table"><tbody>${s.rows.map(([r,cs])=>`<tr><td>${r}</td>${cs.map(([c,v])=>`<td><small class="muted">${String.fromCharCode(65+c)}</small><br>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function switchView(view){state.view=view;$('.nav.active')?.classList.remove('active');document.querySelector(`.nav[data-view="${view}"]`)?.classList.add('active');$('#builds-view').hidden=view!=='builds';$('#catalog-view').hidden=view!=='catalog';$('#mechanics-view').hidden=view!=='mechanics';$('#saves-view').hidden=view!=='saves';$('#mode-tabs').hidden=view!=='builds';$('.search-wrap').hidden=['mechanics','saves'].includes(view);$('.side-section').hidden=view!=='builds';$('#favorite-filter').hidden=view!=='builds';
 const labels={saves:['存档与数据体','从完整搭配，到全潜能数据体','导入存档，添加传承用或完整战斗搭配的数据体。'],builds:['组合教程','从一份传承，到多重联动','选一套组合，沿着升级路线，把每一个红策略连起来。'],catalog:['策略图鉴','每一种联动，都有迹可循','查询策略占用、传承条件与局内触发方式。'],mechanics:['机制与说明','先理解规则，再突破上限','保留原表机制说明、颜色含义与社区来源。']};
 const l=labels[view];$('#current-label').textContent=l[0];$('#page-title').innerHTML=esc(l[1])+'<span>。</span>';$('#page-description').textContent=l[2];$('#search').placeholder=view==='catalog'?'搜索策略、占用或触发条件…':'搜索流派、策略或操作提示…';
 if(view==='builds')renderList();if(view==='catalog')renderCatalog();if(view==='mechanics')renderMechanics();renderRanks();}
function openStrategy(name){lastFocus=document.activeElement;const {conditions,strategies}=findRecords(data,name);const alternatives=unique(name.split(/[\/／]/)).filter(x=>x!==name);const used=data.combos.filter(b=>b.slots.some(s=>s.reds.some(c=>c.text.includes(name))));
 const lists=(title,items)=>`<div class="drawer-section"><h3>${title}</h3>${items.length?`<ul>${items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="muted">原表未填写</p>'}</div>`;
 $('#strategy-drawer').innerHTML=`<button class="icon-button close" data-close aria-label="关闭策略详情">×</button><p class="overline">STRATEGY ARCHIVE</p><h2 id="drawer-title">${esc(name)}</h2><div class="drawer-sub">占用与激活条件 · 原表信息</div>${alternatives.length?`<div class="alt-buttons">${alternatives.map(n=>`<button data-strategy="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}${conditions.map(c=>`<div class="drawer-section"><span class="drawer-tag">${esc(c.element)}</span><span class="drawer-tag">${esc(c.type)}</span></div>${lists('占用策略',c.occupancy)}${lists('传承触发条件',c.inherit)}${lists('非传承 · 局内触发条件（按原表列示）',c.inRun)}<p class="source-note">各条保留原表顺序，不另行推断“同时满足”或“任选其一”。<br><a target="_blank" rel="noopener" href="${source(c.tab,c.row)}">红策略占用、激活条件 · 第${c.row}行 ↗</a></p>`).join('')}${strategies.map(s=>`${lists('一阶起点',s.tier1)}${lists('二阶分支',s.tier2)}${lists('三阶策略',s.tier3)}${lists('双重触发前置',s.prerequisites)}${lists('双重策略占用',s.occupancy)}${lists('激活数',s.activation)}<p class="source-note"><a target="_blank" rel="noopener" href="${source(s.tab,s.row)}">全策略详情 · 第${s.row}行 ↗</a></p>`).join('')}${!conditions.length&&!strategies.length?`<div class="drawer-section"><p>这是升级路线中的策略名称，原表未以此名称单列双重策略条件。</p><p>可在「策略图鉴」搜索该名称，查看它作为前置或占用策略出现的条目。</p><button class="target-pill" data-search-strategy="${esc(name)}">搜索关联条目 →</button></div>`:''}${used.length?`<div class="drawer-section"><h3>使用这项双重策略的组合 · ${used.length}</h3>${used.map(b=>`<button class="drawer-tag" data-jump-build="${b.id}">${esc(b.name)} ↗</button>`).join('')}</div>`:''}`;
 $('#drawer-backdrop').hidden=false;$('#strategy-drawer').hidden=false;document.body.style.overflow='hidden';$('[data-close]').focus();}
function closeDrawer(){if($('#strategy-drawer').hidden)return;$('#strategy-drawer').hidden=true;$('#drawer-backdrop').hidden=true;document.body.style.overflow='';lastFocus?.focus();}
function setHash(){history.replaceState(null,'',state.view==='builds'?`#build/${state.selected}`:`#${state.view}`);}
function refresh(){renderRanks();if(state.view==='builds')renderList();if(state.view==='catalog')renderCatalog();}
document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b){if(e.target.id==='drawer-backdrop')closeDrawer();return;}
 if(b.dataset.view){switchView(b.dataset.view);setHash();}
 if(b.dataset.rank!==undefined){state.rank=Number(b.dataset.rank);switchView('builds');setHash();}
 if(b.dataset.mode){state.mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));renderList();}
 if(b.dataset.build){state.selected=b.dataset.build;state.detailTab='route';renderList();setHash();}
 if(b.hasAttribute('data-export-combo')){window.SaveBodyUI.openCombo(current());switchView('saves');setHash();}
 if(b.hasAttribute('data-export-full')){window.FullBodyUI.load(0,'guide:'+current().id);const pair=document.querySelector('#save-pair');pair.checked=false;pair.dispatchEvent(new Event('change',{bubbles:true}));switchView('saves');setHash();}
 if(b.dataset.detailTab){state.detailTab=b.dataset.detailTab;renderDetail();}
 if(b.hasAttribute('data-save')){const c=current();const i=favorites.indexOf(c.id);if(i<0)favorites.push(c.id);else favorites.splice(i,1);save('red-guide-favorites',favorites);refresh();}
 if(b.id==='favorite-filter'){state.onlySaved=!state.onlySaved;switchView('builds');}
 if(b.hasAttribute('data-clear')){state.rank=0;state.mode='all';state.onlySaved=false;state.query='';$('#search').value='';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='all'));refresh();}
 if(b.hasAttribute('data-share')){setHash();try{await navigator.clipboard.writeText(location.href);toast('已复制这套组合的链接')}catch{toast('链接已定位到当前组合，可复制地址栏分享')}}
 if(b.dataset.strategy)openStrategy(b.dataset.strategy);
 if(b.hasAttribute('data-close'))closeDrawer();
 if(b.dataset.element){state.element=b.dataset.element;renderCatalog();}
 if(b.dataset.raw!==undefined)renderRaw(Number(b.dataset.raw));
 if(b.hasAttribute('data-reset-checks')){checks[state.selected]=[];save('red-guide-checks',checks);renderDetail();}
 if(b.dataset.jumpBuild){closeDrawer();state.rank=0;state.mode='all';state.onlySaved=false;state.query='';$('#search').value='';state.selected=b.dataset.jumpBuild;state.detailTab='route';document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode==='all'));switchView('builds');setHash();}
 if(b.dataset.searchStrategy){const n=b.dataset.searchStrategy;closeDrawer();state.query=n;$('#search').value=n;state.element='全部';switchView('catalog');setHash();}
});
document.addEventListener('change',e=>{if(e.target.dataset.check){const id=e.target.dataset.check;const done=checks[state.selected]||[];checks[state.selected]=e.target.checked?unique([...done,id]):done.filter(x=>x!==id);save('red-guide-checks',checks);renderDetail();}});
$('#search').addEventListener('input',e=>{state.query=e.target.value;refresh();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!['mechanics','saves'].includes(state.view)){e.preventDefault();$('#search').focus();}if(e.key==='Tab'&&!$('#strategy-drawer').hidden){const fs=[...$('#strategy-drawer').querySelectorAll('button,a[href]')];const a=fs[0],z=fs.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
try{const r=await Promise.resolve({ok:true,json:async()=>OFFLINE_DATA});if(!r.ok)throw Error('load');data=await r.json();state.selected=data.combos[0].id;const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith('build/')&&data.combos.some(b=>b.id===h.slice(6)))state.selected=h.slice(6);if(['catalog','mechanics','saves'].includes(h))state.view=h;switchView(state.view);$('#total-count').textContent=data.combos.length;document.querySelector('[data-view="catalog"] b').textContent=records().length;}catch(e){$('#build-detail').innerHTML='<div class="empty-state">攻略数据暂时无法加载，请刷新页面重试。</div>';console.error(e);}
</script>
</body></html>
